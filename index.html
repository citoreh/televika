<html lang="en">
<head>
<meta charset="UTF-8">

<title>Movie Archive</title>

<style>
  :root {
    --bg: #0c0d0a;
    --bg-raised: #16170f;
    --line: #2a2c1f;
    --ink: #eae7d6;
    --ink-dim: #9a9a86;
    --accent: #d4a24e;
    --accent-dim: #8a6a2f;
    --mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    --serif: Georgia, 'Times New Roman', serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
  }

  body {
    min-height: 100vh;
  }

  /* ---------- Header ---------- */

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: linear-gradient(180deg, var(--bg) 70%, transparent);
    padding: 2.5rem 2rem 1.25rem;
    border-bottom: 1px solid var(--line);
  }

  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 0.6rem;
  }

  h1 {
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    font-weight: 400;
    letter-spacing: -0.01em;
    margin: 0 0 1.25rem;
    color: var(--ink);
  }

  h1 em {
    color: var(--accent);
    font-style: normal;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: center;
  }

  .search-wrap {
    position: relative;
    flex: 1 1 260px;
  }

  #search {
    width: 100%;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 0.9rem;
    padding: 0.7rem 0.9rem 0.7rem 2.2rem;
    border-radius: 3px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  #search:focus {
    border-color: var(--accent-dim);
  }

  .search-wrap::before {
    content: "";
    position: absolute;
    left: 0.85rem;
    top: 50%;
    width: 11px;
    height: 11px;
    border: 1.5px solid var(--ink-dim);
    border-radius: 50%;
    transform: translateY(-60%);
  }

  .search-wrap::after {
    content: "";
    position: absolute;
    left: 1.42rem;
    top: 0.95rem;
    width: 1.5px;
    height: 6px;
    background: var(--ink-dim);
    transform: rotate(45deg);
  }

  select, .sort-btn {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 0.8rem;
    padding: 0.7rem 0.8rem;
    border-radius: 3px;
    cursor: pointer;
    outline: none;
  }

  select:focus, .sort-btn:focus {
    border-color: var(--accent-dim);
  }

  .count {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--ink-dim);
    margin-left: auto;
    white-space: nowrap;
  }

  .count strong {
    color: var(--accent);
    font-weight: 400;
  }

  /* ---------- Grid ---------- */

  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 1.75rem 2rem 4rem;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }

  .card {
    background: var(--bg);
    padding: 1.1rem 1.15rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    text-decoration: none;
    color: inherit;
    transition: background 0.15s ease;
    min-height: 128px;
  }

  .card:hover {
    background: var(--bg-raised);
  }

  .card:hover .card-title {
    color: var(--accent);
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.5rem;
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--ink-dim);
  }

  .badge {
    display: inline-block;
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    padding: 0.1rem 0.4rem;
    border-radius: 2px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 0.62rem;
  }

  .rating {
    font-family: var(--mono);
    color: var(--ink-dim);
  }

  .rating.high { color: var(--accent); }

  .card-title {
    font-size: 1.02rem;
    line-height: 1.3;
    color: var(--ink);
    margin: 0;
    flex: 1;
  }

  .card-meta {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--ink-dim);
    display: flex;
    justify-content: space-between;
    gap: 0.5rem;
    border-top: 1px solid var(--line);
    padding-top: 0.5rem;
    margin-top: auto;
  }

  .card-genre {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #empty {
    display: none;
    text-align: center;
    padding: 4rem 1rem;
    color: var(--ink-dim);
    font-family: var(--mono);
    font-size: 0.85rem;
  }

  footer {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 2rem 3rem;
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--ink-dim);
    letter-spacing: 0.03em;
  }

  @media (max-width: 560px) {
    header { padding: 1.75rem 1.1rem 1rem; }
    main { padding: 1.25rem 1.1rem 3rem; }
    .count { margin-left: 0; width: 100%; order: 5; }
    #grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  }
</style>
</head>

  const GENRES = ["Action", "Adventure", "Animation", "Biography", "Comedy", "Crime", "Documentary", "Drama", "Family", "Fantasy", "History", "Horror", "Music", "Mystery", "Reality-TV", "Romance", "Short", "Sport", "Theatre", "Thriller", "War"];

  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('empty');
  const countEl = document.getElementById('count');
  const searchInput = document.getElementById('search');
  const genreSelect = document.getElementById('genre-filter');
  const sortSelect = document.getElementById('sort-by');

  GENRES.forEach(g => {
    const opt = document.createElement('option');
    opt.value = g;
    opt.textContent = g;
    genreSelect.appendChild(opt);
  });

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  function cardHtml(m) {
    const ratingClass = m.r && m.r >= 7 ? 'rating high' : 'rating';
    const ratingText = m.r ? m.r.toFixed(1) + '/10' : '&mdash;';
    const badge = m.x ? '<span class="badge">Exclusive</span>' : (m.o ? '<span class="badge">Online</span>' : '<span></span>');
    const genre = m.g ? escapeHtml(m.g) : '&mdash;';
    const year = m.y ? m.y : '&mdash;';
    return `
      <a class="card" href="${m.h}" aria-label="${escapeHtml(m.t)}">
        <div class="card-top">
          ${badge}
          <span class="${ratingClass}">${ratingText}</span>
        </div>
        <p class="card-title">${escapeHtml(m.t)}</p>
        <div class="card-meta">
          <span class="card-genre">${genre}</span>
          <span>${year}</span>
        </div>
      </a>`;
  }

  function render() {
    const q = searchInput.value.trim().toLowerCase();
    const genre = genreSelect.value;
    const sortBy = sortSelect.value;

    let list = MOVIES.filter(m => {
      const matchesQuery = !q || m.t.toLowerCase().includes(q);
      const matchesGenre = !genre || (m.g && m.g.split(',').map(s => s.trim()).includes(genre));
      return matchesQuery && matchesGenre;
    });

    list = list.slice().sort((a, b) => {
      if (sortBy === 'rating') return (b.r || 0) - (a.r || 0);
      if (sortBy === 'year') return (b.y || 0) - (a.y || 0);
      return a.t.localeCompare(b.t);
    });

    grid.innerHTML = list.map(cardHtml).join('');
    countEl.textContent = list.length;
    emptyState.style.display = list.length === 0 ? 'block' : 'none';
  }

  searchInput.addEventListener('input', render);
  genreSelect.addEventListener('change', render);
  sortSelect.addEventListener('change', render);

  render();
</script>
