<html lang="en">
<head>
<meta charset="UTF-8">

<title>Movie Archive</title>

<style>
  :root {
    --bg: #0c0d0a;
    --bg-raised: #16170f;
    --line: #2a2c1f;
    --ink: #eae7d6;
    --ink-dim: #9a9a86;
    --accent: #d4a24e;
    --accent-dim: #8a6a2f;
    --mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    --serif: Georgia, 'Times New Roman', serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
  }

  body {
    min-height: 100vh;
  }

  /* ---------- Header ---------- */

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: linear-gradient(180deg, var(--bg) 70%, transparent);
    padding: 2.5rem 2rem 1.25rem;
    border-bottom: 1px solid var(--line);
  }

  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 0.6rem;
  }

  h1 {
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    font-weight: 400;
    letter-spacing: -0.01em;
    margin: 0 0 1.25rem;
    color: var(--ink);
  }

  h1 em {
    color: var(--accent);
    font-style: normal;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: center;
  }

  .search-wrap {
    position: relative;
    flex: 1 1 260px;
  }

  #search {
    width: 100%;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 0.9rem;
    padding: 0.7rem 0.9rem 0.7rem 2.2rem;
    border-radius: 3px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  #search:focus {
    border-color: var(--accent-dim);
  }

  .search-wrap::before {
    content: "";
    position: absolute;
    left: 0.85rem;
    top: 50%;
    width: 11px;
    height: 11px;
    border: 1.5px solid var(--ink-dim);
    border-radius: 50%;
    transform: translateY(-60%);
  }

  .search-wrap::after {
    content: "";
    position: absolute;
    left: 1.42rem;
    top: 0.95rem;
    width: 1.5px;
    height: 6px;
    background: var(--ink-dim);
    transform: rotate(45deg);
  }

  select, .sort-btn {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 0.8rem;
    padding: 0.7rem 0.8rem;
    border-radius: 3px;
    cursor: pointer;
    outline: none;
  }

  select:focus, .sort-btn:focus {
    border-color: var(--accent-dim);
  }

  .count {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--ink-dim);
    margin-left: auto;
    white-space: nowrap;
  }

  .count strong {
    color: var(--accent);
    font-weight: 400;
  }

  /* ---------- Grid ---------- */

  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 1.75rem 2rem 4rem;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }

  .card {
    background: var(--bg);
    padding: 0;
    display: flex;
    flex-direction: column;
    text-align: left;
    border: none;
    cursor: pointer;
    color: inherit;
    font: inherit;
    transition: background 0.15s ease;
    min-height: 128px;
  }

  .card:hover {
    background: var(--bg-raised);
  }

  .card:hover .card-title {
    color: var(--accent);
  }

  .poster-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 3;
    background: var(--bg-raised);
    overflow: hidden;
  }

  .poster-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .poster-wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.65) 100%);
  }

  .poster-wrap.no-image {
    background:
      linear-gradient(135deg, var(--bg-raised) 0%, var(--bg) 100%);
  }

  .poster-wrap.no-image::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      45deg, var(--line) 0 1px, transparent 1px 14px
    );
    opacity: 0.5;
  }

  .play-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(12, 13, 10, 0.72);
    border: 1px solid var(--accent-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.15s ease;
    z-index: 1;
  }

  .card:hover .play-icon {
    opacity: 1;
  }

  .play-icon svg {
    width: 14px;
    height: 14px;
    fill: var(--accent);
    margin-left: 2px;
  }

  .card-body {
    padding: 0.9rem 1.1rem 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    flex: 1;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.5rem;
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--ink-dim);
  }

  .badge {
    display: inline-block;
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    padding: 0.1rem 0.4rem;
    border-radius: 2px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 0.62rem;
  }

  .rating {
    font-family: var(--mono);
    color: var(--ink-dim);
  }

  .rating.high { color: var(--accent); }

  .card-title {
    font-size: 1.02rem;
    line-height: 1.3;
    color: var(--ink);
    margin: 0;
    flex: 1;
  }

  .card-meta {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--ink-dim);
    display: flex;
    justify-content: space-between;
    gap: 0.5rem;
    border-top: 1px solid var(--line);
    padding-top: 0.5rem;
    margin-top: auto;
  }

  .card-genre {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #empty {
    display: none;
    text-align: center;
    padding: 4rem 1rem;
    color: var(--ink-dim);
    font-family: var(--mono);
    font-size: 0.85rem;
  }

  footer {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 2rem 3rem;
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--ink-dim);
    letter-spacing: 0.03em;
  }

  @media (max-width: 560px) {
    header { padding: 1.75rem 1.1rem 1rem; }
    main { padding: 1.25rem 1.1rem 3rem; }
    .count { margin-left: 0; width: 100%; order: 5; }
    #grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }

  /* ---------- Player modal ---------- */

  #player-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(6, 6, 4, 0.92);
    padding: 4vh 4vw;
    align-items: center;
    justify-content: center;
  }

  #player-overlay.open {
    display: flex;
  }

  #player-panel {
    width: 100%;
    max-width: 1100px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
  }

  #player-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.9rem 1.1rem;
    border-bottom: 1px solid var(--line);
  }

  #player-title {
    font-size: 1rem;
    margin: 0;
    color: var(--ink);
  }

  #player-close {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.4rem 0.7rem;
    border-radius: 3px;
    cursor: pointer;
  }

  #player-close:hover {
    color: var(--accent);
    border-color: var(--accent-dim);
  }

  #player-video {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    display: block;
  }

  #player-status {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--ink-dim);
    padding: 0.6rem 1.1rem 0.9rem;
  }

  #player-status.error {
    color: #e07a5f;
  }
</style>
</head>

  const GENRES = ["Action", "Adventure", "Animation", "Biography", "Comedy", "Crime", "Documentary", "Drama", "Family", "Fantasy", "History", "Horror", "Music", "Mystery", "Reality-TV", "Romance", "Short", "Sport", "Theatre", "Thriller", "War"];

  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('empty');
  const countEl = document.getElementById('count');
  const searchInput = document.getElementById('search');
  const genreSelect = document.getElementById('genre-filter');
  const sortSelect = document.getElementById('sort-by');

  GENRES.forEach(g => {
    const opt = document.createElement('option');
    opt.value = g;
    opt.textContent = g;
    genreSelect.appendChild(opt);
  });

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  function cardHtml(m, idx) {
    const ratingClass = m.r && m.r >= 7 ? 'rating high' : 'rating';
    const ratingText = m.r ? m.r.toFixed(1) + '/10' : '&mdash;';
    const badge = m.x ? '<span class="badge">Exclusive</span>' : (m.o ? '<span class="badge">Online</span>' : '<span></span>');
    const genre = m.g ? escapeHtml(m.g) : '&mdash;';
    const year = m.y ? m.y : '&mdash;';
    const poster = m.i
      ? `<img src="${m.i}" alt="" loading="lazy" decoding="async" onerror="this.parentElement.classList.add('no-image'); this.remove();">`
      : '';
    return `
      <button class="card" type="button" data-idx="${idx}" aria-label="Play ${escapeHtml(m.t)}">
        <div class="poster-wrap">
          ${poster}
          <span class="play-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5-11-6.5z"/></svg>
          </span>
        </div>
        <div class="card-body">
          <div class="card-top">
            ${badge}
            <span class="${ratingClass}">${ratingText}</span>
          </div>
          <p class="card-title">${escapeHtml(m.t)}</p>
          <div class="card-meta">
            <span class="card-genre">${genre}</span>
            <span>${year}</span>
          </div>
        </div>
      </button>`;
  }

  let currentList = MOVIES;

  function render() {
    const q = searchInput.value.trim().toLowerCase();
    const genre = genreSelect.value;
    const sortBy = sortSelect.value;

    let list = MOVIES.filter(m => {
      const matchesQuery = !q || m.t.toLowerCase().includes(q);
      const matchesGenre = !genre || (m.g && m.g.split(',').map(s => s.trim()).includes(genre));
      return matchesQuery && matchesGenre;
    });

    list = list.slice().sort((a, b) => {
      if (sortBy === 'rating') return (b.r || 0) - (a.r || 0);
      if (sortBy === 'year') return (b.y || 0) - (a.y || 0);
      return a.t.localeCompare(b.t);
    });

    currentList = list;
    grid.innerHTML = list.map(cardHtml).join('');
    countEl.textContent = list.length;
    emptyState.style.display = list.length === 0 ? 'block' : 'none';
  }

  searchInput.addEventListener('input', render);
  genreSelect.addEventListener('change', render);
  sortSelect.addEventListener('change', render);

  // ---------- HLS player ----------

  const overlay = document.getElementById('player-overlay');
  const videoEl = document.getElementById('player-video');
  const titleEl = document.getElementById('player-title');
  const statusEl = document.getElementById('player-status');
  const closeBtn = document.getElementById('player-close');
  let hlsInstance = null;

  function setStatus(text, isError) {
    statusEl.textContent = text || '';
    statusEl.classList.toggle('error', !!isError);
  }

  function destroyPlayer() {
    if (hlsInstance) {
      hlsInstance.destroy();
      hlsInstance = null;
    }
    videoEl.pause();
    videoEl.removeAttribute('src');
    videoEl.load();
  }

  function playMovie(m) {
    titleEl.textContent = m.t;
    setStatus('Loading stream…');
    overlay.classList.add('open');
    destroyPlayer();

    const src = m.h;

    if (window.Hls && Hls.isSupported()) {
      hlsInstance = new Hls();
      hlsInstance.loadSource(src);
      hlsInstance.attachMedia(videoEl);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
        setStatus('');
        videoEl.play().catch(() => {});
      });
      hlsInstance.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          setStatus('Could not load "' + src + '". Check that the file exists next to this page.', true);
        }
      });
    } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
      // Native HLS support (Safari)
      videoEl.src = src;
      videoEl.addEventListener('loadedmetadata', () => {
        setStatus('');
        videoEl.play().catch(() => {});
      }, { once: true });
      videoEl.addEventListener('error', () => {
        setStatus('Could not load "' + src + '". Check that the file exists next to this page.', true);
      }, { once: true });
    } else {
      setStatus('This browser cannot play HLS (.m3u8) streams.', true);
    }
  }

  grid.addEventListener('click', (e) => {
    const card = e.target.closest('.card');
    if (!card) return;
    const idx = Number(card.dataset.idx);
    const movie = currentList[idx];
    if (movie) playMovie(movie);
  });

  closeBtn.addEventListener('click', () => {
    overlay.classList.remove('open');
    destroyPlayer();
  });

  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) {
      overlay.classList.remove('open');
      destroyPlayer();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) {
      overlay.classList.remove('open');
      destroyPlayer();
    }
  });

  render();
</script>
